# Example playbook demonstrating powerflex_system_v2 configuration validation
# Validates MDM cluster, protection domains, storage pools, and volumes

- name: PowerFlex Gen2 Configuration Validation
  hosts: localhost
  gather_facts: false
  vars:
    powerflex_gateway_hostname: "192.168.1.100"
    powerflex_gateway_username: "admin"
    powerflex_gateway_password: "your_password"
    powerflex_gateway_port: 443
    powerflex_gateway_validate_certs: true
    powerflex_gateway_timeout: 30

  tasks:
    - name: Run powerflex_common_v2 role
      ansible.builtin.include_role:
        name: powerflex_common_v2

    - name: Run powerflex_system_v2 role for validation
      ansible.builtin.include_role:
        name: powerflex_system_v2
      vars:
        powerflex_system_query: false
        powerflex_system_validate: true
        powerflex_system_diagnostics: false
        powerflex_validate_mdm_cluster: true
        powerflex_validate_protection_domains: true
        powerflex_validate_storage_pools: true
        powerflex_validate_volumes: true
