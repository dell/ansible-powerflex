# Example playbook demonstrating powerflex_common_v2 role
# This playbook detects PowerFlex generation and validates Gen2 compatibility

- name: PowerFlex Gen2 Detection and Validation
  hosts: localhost
  gather_facts: false
  vars:
    powerflex_gateway_hostname: "192.168.1.100"
    powerflex_gateway_username: "admin"
    powerflex_gateway_password: "your_password"
    powerflex_gateway_port: 443
    powerflex_gateway_validate_certs: true
    powerflex_gateway_timeout: 30

  tasks:
    - name: Run powerflex_common_v2 role
      ansible.builtin.include_role:
        name: powerflex_common_v2

    - name: Display detected generation
      ansible.builtin.debug:
        msg: "Detected PowerFlex generation: {{ powerflex_generation }}"

    - name: Display skip flag
      ansible.builtin.debug:
        msg: "Gen2 tasks will be skipped: {{ powerflex_gen2_skip | default(false) }}"

    - name: Continue with Gen2-specific tasks if applicable
      ansible.builtin.debug:
        msg: "Proceeding with Gen2-specific provisioning..."
      when: powerflex_generation == 'gen2' and not powerflex_gen2_skip | default(false)
