# Example playbook demonstrating powerflex_provisioning_v2 volume lifecycle
# This playbook creates, modifies, maps, and deletes volumes

- name: PowerFlex Gen2 Volume Lifecycle Management
  hosts: localhost
  gather_facts: false
  vars:
    powerflex_gateway_hostname: "192.168.1.100"
    powerflex_gateway_username: "admin"
    powerflex_gateway_password: "your_password"
    powerflex_gateway_port: 443
    powerflex_gateway_validate_certs: true
    powerflex_gateway_timeout: 30

    # Volume parameters
    powerflex_volume_name: "test_volume"
    powerflex_volume_size_gb: 100
    powerflex_volume_storage_pool_name: "pool1"
    powerflex_volume_protection_domain_name: "domain1"
    # powerflex_volume_sdc_id: "sdc_id_here"  # Set to a real SDC ID to test mapping

  tasks:
    - name: Run powerflex_common_v2 role
      ansible.builtin.include_role:
        name: powerflex_common_v2

    - name: Run powerflex_provisioning_v2 role for volumes
      ansible.builtin.include_role:
        name: powerflex_provisioning_v2
      vars:
        powerflex_provision_volumes: true
        powerflex_provision_snapshots: false
        powerflex_provision_infrastructure: false
