# Example playbook demonstrating powerflex_system_v2 system diagnostics
# Generates system health, capacity, and snapshot utilization reports

- name: PowerFlex Gen2 System Diagnostics
  hosts: localhost
  gather_facts: false
  vars:
    powerflex_gateway_hostname: "192.168.1.100"
    powerflex_gateway_username: "admin"
    powerflex_gateway_password: "your_password"
    powerflex_gateway_port: 443
    powerflex_gateway_validate_certs: true
    powerflex_gateway_timeout: 30

  tasks:
    - name: Run powerflex_common_v2 role
      ansible.builtin.include_role:
        name: powerflex_common_v2

    - name: Run powerflex_system_v2 role for diagnostics
      ansible.builtin.include_role:
        name: powerflex_system_v2
      vars:
        powerflex_system_query: false
        powerflex_system_validate: false
        powerflex_system_diagnostics: true
        powerflex_diag_system_health: true
        powerflex_diag_capacity_report: true
        powerflex_diag_snapshot_report: true
