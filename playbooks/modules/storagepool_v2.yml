---
- name: StoragePool V2 Operations
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    hostname: "x.x.x.x"
    username: "admin"
    password: "Password"
    validate_certs: false
    # Use unique names to avoid conflicts
    sp_name: "ansible_example_pool"
    sp_new_name: "ansible_example_pool_renamed"
    pd_name: "ansible_example_domain"
    dg_name: "ansible_example_dg"

  tasks:
    - name: Create protection domain for pool
      register: pd_result
      dellemc.powerflex.protection_domain_v2:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: false
        protection_domain_name: "{{ pd_name }}"
        is_active: true
        state: "present"

    - name: Create device group for pool
      register: dg_result
      dellemc.powerflex.device_group:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: false
        device_group_name: "{{ dg_name }}"
        protection_domain_name: "{{ pd_name }}"
        media_type: "SSD"
        state: "present"

    - name: Create storagepool with cap_alert_threshold
      register: sp_result
      dellemc.powerflex.storagepool_v2:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        storage_pool_name: "{{ sp_name }}"
        protection_domain_name: "{{ pd_name }}"
        device_group_name: "{{ dg_name }}"
        protection_scheme: "TwoPlusTwo"
        compression_method: "Normal"
        use_all_available_capacity: true
        cap_alert_thresholds:
          high_threshold: 80
          critical_threshold: 90
        over_provisioning_factor: 100
        state: "present"

    - name: Set storage pool ID
      set_fact:
        sp_id: "{{ sp_result.storage_pool_details.id }}"

    - name: Get storagepool details using storagepool id
      dellemc.powerflex.storagepool_v2:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        storage_pool_id: "{{ sp_id }}"
        state: "present"

    - name: Modify the cap_alert_thresholds
      dellemc.powerflex.storagepool_v2:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        storage_pool_name: "{{ sp_name }}"
        protection_domain_name: "{{ pd_name }}"
        cap_alert_thresholds:
          high_threshold: 85
          critical_threshold: 95
        state: "present"

    - name: Rename storagepool
      dellemc.powerflex.storagepool_v2:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        storage_pool_id: "{{ sp_id }}"
        storage_pool_new_name: "{{ sp_new_name }}"
        state: "present"

    - name: Delete storagepool
      dellemc.powerflex.storagepool_v2:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        storage_pool_id: "{{ sp_id }}"
        state: "absent"

    - name: Delete device group
      dellemc.powerflex.device_group:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: false
        device_group_name: "{{ dg_name }}"
        state: "absent"

    - name: Delete protection domain
      dellemc.powerflex.protection_domain_v2:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: false
        protection_domain_name: "{{ sp_new_name }}"
        state: "absent"
