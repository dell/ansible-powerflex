---
- name: MDM cluster Operations
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Default to Oslo2 - override with -e "hostname=10.247.39.38" for Oslo1
    hostname: '10.247.39.166'
    username: 'admin'
    password: 'Password'
    validate_certs: false
    host_port: 443
    # Oslo2 MDM IDs
    mdm_master_id: "4fcc727945bc9a00"
    mdm_master_name: "destiny-mdm1"
    mdm_slave_id: "609f150f17611301"
    mdm_slave_name: "destiny-mdm2"
    mdm_standby_id: "6645cc62460a1303"
    mdm_standby_name: "destiny-mdm3"
    mdm_tiebreaker_id: "4f88b53a36540002"
    mdm_tiebreaker_name: "destiny-mdm4"

  tasks:
    - name: Get MDM cluster
      dellemc.powerflex.mdm_cluster:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        port: "{{ host_port }}"
        state: "present"

    - name: Rename MDM cluster with check_mode
      dellemc.powerflex.mdm_cluster:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        port: "{{ host_port }}"
        mdm_id: "{{ mdm_master_id }}"
        mdm_new_name: "node_renamed"
        state: "present"
      check_mode: true

    - name: Rename MDM cluster
      dellemc.powerflex.mdm_cluster:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        port: "{{ host_port }}"
        mdm_id: "{{ mdm_master_id }}"
        mdm_new_name: "node_renamed"
        state: "present"

    - name: Remove standby MDM
      dellemc.powerflex.mdm_cluster:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        port: "{{ host_port }}"
        mdm_name: "{{ mdm_standby_name }}"
        state: "absent"

    - name: Add standby MDM
      dellemc.powerflex.mdm_cluster:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        port: "{{ host_port }}"
        mdm_name: "{{ mdm_standby_name }}"
        standby_mdm:
          mdm_ips:
            - "10.247.58.164"
          role: "Manager"
          management_ips:
            - "10.247.39.173"
          port: 9011
        state: "present"

    - name: Change MDM cluster owner
      dellemc.powerflex.mdm_cluster:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        port: "{{ host_port }}"
        mdm_name: "node_renamed"
        is_primary: true
        state: "present"

    - name: Change virtual IP interface
      dellemc.powerflex.mdm_cluster:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        port: "{{ host_port }}"
        mdm_name: "node_renamed"
        virtual_ip_interfaces:
          - "ens224"
          - "ens256"
        state: "present"

    - name: Clear virtual IP interface
      dellemc.powerflex.mdm_cluster:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        port: "{{ host_port }}"
        mdm_name: "node_renamed"
        clear_interfaces: true
        state: "present"

    - name: Change Performance profile
      dellemc.powerflex.mdm_cluster:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        port: "{{ host_port }}"
        performance_profile: "Compact"
        state: "present"

    - name: Switch cluster mode to FiveNodes
      dellemc.powerflex.mdm_cluster:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        port: "{{ host_port }}"
        cluster_mode: "FiveNodes"
        mdm:
          - mdm_name: "{{ mdm_slave_name }}"
            mdm_type: "Secondary"
          - mdm_name: "{{ mdm_tiebreaker_name }}"
            mdm_type: "TieBreaker"
        mdm_state: "present-in-cluster"
        state: "present"

    - name: Switch cluster mode to ThreeNodes
      dellemc.powerflex.mdm_cluster:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        port: "{{ host_port }}"
        cluster_mode: "ThreeNodes"
        mdm:
          - mdm_name: "{{ mdm_slave_name }}"
            mdm_type: "Secondary"
          - mdm_name: "{{ mdm_tiebreaker_name }}"
            mdm_type: "TieBreaker"
        mdm_state: "absent-in-cluster"
        state: "present"

    - name: Rename MDM back to original name
      dellemc.powerflex.mdm_cluster:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        port: "{{ host_port }}"
        mdm_id: "{{ mdm_master_id }}"
        mdm_new_name: "{{ mdm_master_name }}"
        state: "present"
