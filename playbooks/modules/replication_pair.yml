---
- name: Replication pair operations on PowerFlex array.
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    hostname: "{{ lookup('env', 'POWERFLEX_HOST') | default('x.x.x.x', true) }}"
    remote_hostname: "{{ lookup('env', 'POWERFLEX_HOST') | default('x.x.x.x', true) }}"
    username: "{{ lookup('env', 'POWERFLEX_USER') | default('admin', true) }}"
    password: "{{ lookup('env', 'POWERFLEX_PASS') | default('CHANGE_ME', true) }}"
    remote_username: "{{ lookup('env', 'POWERFLEX_USER') | default('admin', true) }}"
    remote_password: "{{ lookup('env', 'POWERFLEX_PASS') | default('CHANGE_ME', true) }}"
    validate_certs: false
    rcg_name: "rcg_test"
    pair_name: "test_pair"
    source_volume_name: "testvol"
    target_volume_name: "testvol_target"

  tasks:
    - name: Delete existing replication pair if present
      dellemc.powerflex.replication_pair:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        pair_name: "{{ pair_name }}"
        state: "absent"
      failed_when: false

    - name: Add replication pair to RCG
      register: result
      dellemc.powerflex.replication_pair:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        pairs:
          - source_volume_name: "{{ source_volume_name }}"
            target_volume_name: "{{ target_volume_name }}"
            copy_type: "OnlineCopy"
            name: "{{ pair_name }}"
        rcg_name: "{{ rcg_name }}"
        remote_peer:
          hostname: "{{ remote_hostname }}"
          username: "{{ remote_username }}"
          password: "{{ remote_password }}"
          validate_certs: "{{ validate_certs }}"

    - name: Display replication pair creation result
      ansible.builtin.debug:
        var: result

    - name: Get replication pair details by name
      register: result
      dellemc.powerflex.replication_pair:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        pair_name: "{{ pair_name }}"

    - name: Display replication pair details
      ansible.builtin.debug:
        var: result

    - name: Get replication pair details by id
      register: result
      dellemc.powerflex.replication_pair:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        pair_id: "{{ result.replication_pair_details.id }}"
        state: "present"

    - name: Display replication pair details by id
      ansible.builtin.debug:
        var: result

    - name: Pause replication pair
      register: result
      dellemc.powerflex.replication_pair:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        pair_name: "{{ pair_name }}"
        pause: true

    - name: Display pause result
      ansible.builtin.debug:
        var: result

    - name: Resume replication pair
      register: result
      dellemc.powerflex.replication_pair:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        pair_name: "{{ pair_name }}"
        pause: false

    - name: Display resume result
      ansible.builtin.debug:
        var: result

    - name: Delete replication pair
      register: delete_result
      dellemc.powerflex.replication_pair:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        pair_name: "{{ pair_name }}"
        state: "absent"

    - name: Display deletion result
      ansible.builtin.debug:
        var: delete_result

    - name: Recreate replication pair for future use
      register: result
      dellemc.powerflex.replication_pair:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        pairs:
          - source_volume_name: "{{ source_volume_name }}"
            target_volume_name: "{{ target_volume_name }}"
            copy_type: "OnlineCopy"
            name: "{{ pair_name }}"
        rcg_name: "{{ rcg_name }}"
        remote_peer:
          hostname: "{{ remote_hostname }}"
          username: "{{ remote_username }}"
          password: "{{ remote_password }}"
          validate_certs: "{{ validate_certs }}"

    - name: Display recreate result
      ansible.builtin.debug:
        var: result
