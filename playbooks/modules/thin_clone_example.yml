---
# ============================================================================
# thin_clone examples
#
# This module CREATES thin clones. Rename / delete / resize / map are performed
# by dellemc.powerflex.volume — demonstrated in tasks below.
# ============================================================================
- name: PowerFlex thin_clone examples
  hosts: localhost
  gather_facts: false
  vars:
    hostname: 'x.x.x.x'
    username: 'admin'
    password: 'Password'
    validate_certs: false
    # Use unique names
    src_vol_name: "ansible_src_vol"
    snap_name: "ansible_snap"
    clone_from_vol: "ansible_clone_vol"
    clone_from_snap: "ansible_clone_snap"

  tasks:
    - name: Create source volume
      register: vol_result
      dellemc.powerflex.volume_v2:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        vol_name: "{{ src_vol_name }}"
        storage_pool_name: "{{ storage_pool_name }}"
        protection_domain_name: "{{ protection_domain_name }}"
        size: 8
        state: "present"

    - name: Create snapshot
      register: snap_result
      dellemc.powerflex.snapshot_v2:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        snapshot_name: "{{ snap_name }}"
        vol_name: "{{ src_vol_name }}"
        state: "present"

    - name: Set source volume id
      ansible.builtin.set_fact:
        vol_id: "{{ vol_result.volume_details.id }}"
        snap_id: "{{ snap_result.snapshot_details.id }}"

    - name: Create clone from source volume by name
      register: clone_vol_result
      dellemc.powerflex.thin_clone:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        from_volume_name: "{{ src_vol_name }}"
        new_clone_name: "{{ clone_from_vol }}"
        state: present

    - name: Create clone from read-only snapshot by name
      register: clone_snap_result
      dellemc.powerflex.thin_clone:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        from_snapshot_name: "{{ snap_name }}"
        new_clone_name: "{{ clone_from_snap }}"
        state: present

    - name: Idempotent re-run (identical to above; expected changed=false)
      dellemc.powerflex.thin_clone:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        from_volume_name: "{{ src_vol_name }}"
        new_clone_name: "{{ clone_from_vol }}"
        state: present

    - name: Check mode example
      dellemc.powerflex.thin_clone:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        from_volume_name: "{{ src_vol_name }}"
        new_clone_name: "clone_check_mode"
        state: present
      check_mode: true

    - name: "Cleanup: Delete clone from snapshot"
      dellemc.powerflex.volume_v2:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        vol_id: "{{ clone_snap_result.volume_details.id }}"
        state: absent

    - name: "Cleanup: Delete clone from volume"
      dellemc.powerflex.volume_v2:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        vol_id: "{{ clone_vol_result.volume_details.id }}"
        state: absent

    - name: "Cleanup: Delete snapshot"
      dellemc.powerflex.snapshot_v2:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        snapshot_id: "{{ snap_id }}"
        remove_mode: "ONLY_ME"
        state: absent

    - name: "Cleanup: Delete source volume"
      dellemc.powerflex.volume_v2:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        vol_id: "{{ vol_id }}"
        state: absent
