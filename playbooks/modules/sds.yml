---
- name: SDS Operations
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Default to Oslo2 - override with -e "hostname=10.247.39.38" for Oslo1
    hostname: '10.247.39.166'
    username: 'admin'
    password: 'Password123!'
    validate_certs: false
    host_port: 443
    # Oslo2 existing SDS nodes
    sds_name_1: "destiny-sds1"
    sds_name_2: "destiny-sds2"
    sds_id_1: "726af23a00000002"
    sds_id_2: "726af23900000001"
    protection_domain_name: "destiny-PD"

  tasks:
    # Note: Create SDS requires a server with SDS software installed and available IPs
    # This is infrastructure that doesn't exist in the test environment
    # - name: Create SDS
    #   register: result
    #   dellemc.powerflex.sds:
    #     hostname: "{{ hostname }}"
    #     username: "{{ username }}"
    #     password: "{{ password }}"
    #     validate_certs: "{{ validate_certs }}"
    #     port: "{{ host_port }}"
    #     sds_name: "new_sds_node"
    #     protection_domain_name: "{{ protection_domain_name }}"
    #     sds_ip_list:
    #       - ip: '10.247.58.169'
    #         role: "all"
    #     sds_ip_state: "present-in-sds"
    #     state: "present"

    - name: Get SDS details using name
      dellemc.powerflex.sds:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        port: "{{ host_port }}"
        sds_name: "{{ sds_name_1 }}"
        state: "present"
      register: sds_result

    - name: Get SDS details using ID
      dellemc.powerflex.sds:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        port: "{{ host_port }}"
        sds_id: "{{ sds_id_1 }}"
        state: "present"

    - name: Modify SDS attributes using name (rename)
      dellemc.powerflex.sds:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        port: "{{ host_port }}"
        sds_name: "{{ sds_name_1 }}"
        sds_new_name: "destiny-sds1-renamed"
        state: "present"

    - name: Modify SDS attributes using ID (rename back)
      dellemc.powerflex.sds:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        port: "{{ host_port }}"
        sds_id: "{{ sds_id_1 }}"
        sds_new_name: "{{ sds_name_1 }}"
        state: "present"

    # Note: Adding/removing IPs requires available IPs and proper network configuration
    # - name: Add IP and role to an SDS
    #   dellemc.powerflex.sds:
    #     hostname: "{{ hostname }}"
    #     username: "{{ username }}"
    #     password: "{{ password }}"
    #     validate_certs: "{{ validate_certs }}"
    #     port: "{{ host_port }}"
    #     sds_name: "{{ sds_name_1 }}"
    #     sds_ip_list:
    #       - ip: '10.247.58.200'
    #         role: "sdcOnly"
    #     sds_ip_state: "present-in-sds"
    #     state: "present"

    # Note: Delete SDS would remove production infrastructure
