---
- name: SDS Operations
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Oslo1 Infrastructure
    hostname: 'x.x.x.x'
    username: 'admin'
    password: 'Password'
    validate_certs: false
    host_port: 443
    # Oslo1 existing SDS nodes
    sds_name_1: "trinity-sds1"
    sds_name_2: "trinity-sds2"
    sds_id_1: "a0d9a54500000002"
    sds_id_2: "a0d9a54400000001"
    protection_domain_name: "trinity-PD"

  tasks:
    # Skip SDS creation due to communication error with 10.247.58.31
    # This requires the SDS software to be installed and network connectivity

    - name: Get SDS details using name (existing SDS)
      dellemc.powerflex.sds:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        port: "{{ host_port }}"
        sds_name: "{{ sds_name_1 }}"
        state: "present"
      register: sds_result

    - name: Get SDS details using ID (existing SDS)
      dellemc.powerflex.sds:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        port: "{{ host_port }}"
        sds_id: "{{ sds_id_1 }}"
        state: "present"

    - name: Modify SDS attributes using name (rename existing SDS)
      dellemc.powerflex.sds:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        port: "{{ host_port }}"
        sds_name: "{{ sds_name_1 }}"
        sds_new_name: "trinity-sds1-renamed"
        state: "present"

    - name: Modify SDS attributes using ID (rename back existing SDS)
      dellemc.powerflex.sds:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        port: "{{ host_port }}"
        sds_id: "{{ sds_id_1 }}"
        sds_new_name: "{{ sds_name_1 }}"
        state: "present"
