---
- name: SDC Operations
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Default to Oslo2 - override with -e "hostname=10.247.39.38" for Oslo1
    hostname: '10.247.39.166'
    username: 'admin'
    password: 'Password123!'
    validate_certs: false
    sdc_name: test_sdc
    # Oslo2 SDC IP: 10.247.100.48, Oslo1 SDC IP: 10.247.64.23
    sdc_ip: "10.247.100.48"

  tasks:
    - name: Get sdc details using sdc ip
      register: result
      dellemc.powerflex.sdc:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        sdc_ip: "{{ sdc_ip }}"
        state: "present"

    - name: Set sdc id
      ansible.builtin.set_fact:
        sdc_id: "{{ result.sdc_details.id }}"
        sdc_orig_name: "{{ result.sdc_details.name }}"

    - name: Rename sdc using sdc id
      dellemc.powerflex.sdc:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        sdc_id: "{{ sdc_id }}"
        sdc_new_name: "{{ sdc_name }}"
        state: "present"

    - name: Get sdc details using sdc name
      dellemc.powerflex.sdc:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        sdc_name: "{{ sdc_name }}"
        state: "present"

    - name: Set performance profile of sdc using sdc name
      dellemc.powerflex.sdc:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        sdc_name: "{{ sdc_name }}"
        performance_profile: "HighPerformance"
        state: "present"

    - name: Restore original sdc name
      dellemc.powerflex.sdc:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        sdc_id: "{{ sdc_id }}"
        sdc_new_name: "{{ sdc_orig_name }}"
        state: "present"
