---
- name: Protection domain V2 Operations
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    hostname: "x.x.x.x"
    username: "admin"
    password: "Password"
    validate_certs: false
    host_port: 443
    # Use unique name to avoid conflicts with existing domains
    pd_name: "ansible_example_domain"

  tasks:
    - name: Create Protection Domain
      register: result
      dellemc.powerflex.protection_domain_v2:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        port: "{{ host_port }}"
        protection_domain_name: "{{ pd_name }}"
        is_active: true
        state: "present"

    - name: Set protection domain ID from created domain
      ansible.builtin.set_fact:
        pd_id: "{{ result.protection_domain_details.id }}"

    - name: Get Protection Domain
      dellemc.powerflex.protection_domain_v2:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        port: "{{ host_port }}"
        protection_domain_name: "{{ pd_name }}"
        state: "present"

    - name: Get Protection Domain using ID
      dellemc.powerflex.protection_domain_v2:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        port: "{{ host_port }}"
        protection_domain_id: "{{ pd_id }}"
        state: "present"

    - name: Modify Protection Domain using ID
      register: result
      dellemc.powerflex.protection_domain_v2:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        port: "{{ host_port }}"
        is_active: false
        protection_domain_id: "{{ pd_id }}"
        protection_domain_new_name: "{{ pd_name }}_renamed"
        state: "present"

    - name: Delete Protection Domain using ID
      register: result
      dellemc.powerflex.protection_domain_v2:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        port: "{{ host_port }}"
        protection_domain_id: "{{ pd_id }}"
        state: "absent"
