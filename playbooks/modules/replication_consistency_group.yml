---
# Replication Consistency Group Operations Playbook
# 
# Investigation Summary: The PowerFlex API, SDK, and Ansible module are functioning correctly.
# DR operations are state-dependent and work when the RCG is in the appropriate state.
# The SDK's failover() method doesn't support force parameter because the API doesn't require it.
# All DR operations are now enabled for comprehensive testing.

- name: Replication consistency group operations on PowerFlex array.
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    hostname: 'x.x.x.x'
    remote_hostname: 'x.x.x.x'
    username: 'admin'
    password: 'Password'
    remote_username: 'admin'
    remote_password: 'Password'
    validate_certs: false
    rcg_name: "rcg_test"
    rcg_renamed_name: "rcg_test_renamed"
    protection_domain_name: "trinity-PD"
    remote_protection_domain_name: "destiny-PD"
    rpo: 120

  tasks:
    - name: Delete existing RCG if present
      dellemc.powerflex.replication_consistency_group:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        rcg_name: "{{ rcg_name }}"
        state: "absent"
      failed_when: false

    - name: Delete existing replication pair if present
      dellemc.powerflex.replication_pair:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        pair_name: "test_pair"
        state: "absent"
      failed_when: false

    - name: Create an RCG between source and target clusters
      register: result
      dellemc.powerflex.replication_consistency_group:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        rcg_name: "{{ rcg_name }}"
        rpo: 120
        protection_domain_name: "{{ protection_domain_name }}"
        activity_mode: "Active"
        remote_peer:
          hostname: "{{ remote_hostname }}"
          username: "{{ remote_username }}"
          password: "{{ remote_password }}"
          validate_certs: "{{ validate_certs }}"
          protection_domain_name: "{{ remote_protection_domain_name }}"

    - name: Get RCG details by name
      register: result
      dellemc.powerflex.replication_consistency_group:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        rcg_name: "{{ rcg_name }}"

    - name: Set RCG ID from result
      ansible.builtin.set_fact:
        rcg_id: "{{ result.replication_consistency_group_details.id }}"

    - name: Get RCG details by id
      register: result
      dellemc.powerflex.replication_consistency_group:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        rcg_id: "{{ rcg_id }}"
        state: "present"

    - name: Add replication pair to RCG
      register: pair_result
      dellemc.powerflex.replication_pair:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        pairs:
          - source_volume_name: "testvol"
            target_volume_name: "testvol_target"
            copy_type: "OnlineCopy"
            name: "test_pair"
        rcg_name: "{{ rcg_name }}"
        remote_peer:
          hostname: "{{ remote_hostname }}"
          username: "{{ remote_username }}"
          password: "{{ remote_password }}"
          validate_certs: "{{ validate_certs }}"

    - name: Wait for replication pair to complete initial copy
      ansible.builtin.pause:
        seconds: 180

    - name: Check replication pair initial copy status
      register: pair_status
      dellemc.powerflex.replication_pair:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        pair_name: "test_pair"

    - name: Display replication pair status
      debug:
        var: pair_status

    - name: Create an RCG snapshot - check mode
      register: result
      dellemc.powerflex.replication_consistency_group:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        rcg_name: "{{ rcg_name }}"
        create_snapshot: true
      check_mode: true

    - name: Create an RCG snapshot
      register: result
      dellemc.powerflex.replication_consistency_group:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        rcg_name: "{{ rcg_name }}"
        create_snapshot: true

    - name: Modify RCG rpo
      register: result
      dellemc.powerflex.replication_consistency_group:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        rcg_name: "{{ rcg_name }}"
        rpo: "{{ rpo }}"

    - name: Modify RCG target volume access mode
      register: result
      dellemc.powerflex.replication_consistency_group:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        rcg_name: "{{ rcg_name }}"
        target_volume_access_mode: "ReadOnly"

    - name: Activate RCG
      register: result
      dellemc.powerflex.replication_consistency_group:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        rcg_name: "{{ rcg_name }}"
        activity_mode: "Active"

    - name: Pause RCG
      register: result
      dellemc.powerflex.replication_consistency_group:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        rcg_name: "{{ rcg_name }}"
        rcg_state: 'pause'
        pause_mode: "StopDataTransfer"

    - name: Resume RCG
      register: result
      dellemc.powerflex.replication_consistency_group:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        rcg_name: "{{ rcg_name }}"
        rcg_state: 'resume'

    - name: Freeze RCG
      register: result
      dellemc.powerflex.replication_consistency_group:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        rcg_name: "{{ rcg_name }}"
        rcg_state: 'freeze'
        force: true

    - name: UnFreeze RCG
      register: result
      dellemc.powerflex.replication_consistency_group:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        rcg_name: "{{ rcg_name }}"
        rcg_state: 'unfreeze'

    - name: Set RCG as consistent
      register: result
      dellemc.powerflex.replication_consistency_group:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        rcg_name: "{{ rcg_name }}"
        is_consistent: true

    - name: Inactivate RCG
      register: result
      dellemc.powerflex.replication_consistency_group:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        rcg_name: "{{ rcg_name }}"
        activity_mode: "Inactive"

    - name: Reactivate RCG
      register: result
      dellemc.powerflex.replication_consistency_group:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        rcg_name: "{{ rcg_name }}"
        activity_mode: "Active"

    - name: Rename RCG
      register: result
      dellemc.powerflex.replication_consistency_group:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        rcg_name: "{{ rcg_name }}"
        new_rcg_name: "{{ rcg_renamed_name }}"

    - name: Rename RCG back to original name
      register: result
      dellemc.powerflex.replication_consistency_group:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        rcg_name: "{{ rcg_renamed_name }}"
        new_rcg_name: "rcg_test"

    # DR Operations - Enabled for comprehensive testing
    - name: Failover RCG
      register: failover_result
      dellemc.powerflex.replication_consistency_group:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        rcg_name: "{{ rcg_name }}"
        rcg_state: "failover"

    - name: Reverse RCG
      register: reverse_result
      dellemc.powerflex.replication_consistency_group:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        rcg_name: "{{ rcg_name }}"
        rcg_state: "reverse"

    - name: Restore RCG
      register: restore_result
      dellemc.powerflex.replication_consistency_group:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        rcg_name: "{{ rcg_name }}"
        rcg_state: "restore"

    - name: Switchover RCG
      register: switchover_result
      dellemc.powerflex.replication_consistency_group:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        rcg_name: "{{ rcg_name }}"
        rcg_state: "switchover"
        force: true

    - name: Delete RCG
      register: delete_result
      dellemc.powerflex.replication_consistency_group:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        rcg_name: "{{ rcg_name }}"
        state: "absent"

    - name: Recreate RCG for future use
      register: result
      dellemc.powerflex.replication_consistency_group:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        rcg_name: "{{ rcg_name }}"
        rpo: 120
        protection_domain_name: "{{ protection_domain_name }}"
        activity_mode: "Active"
        state: "present"
        remote_peer:
          hostname: "{{ remote_hostname }}"
          username: "{{ remote_username }}"
          password: "{{ remote_password }}"
          validate_certs: "{{ validate_certs }}"
          protection_domain_name: "{{ remote_protection_domain_name }}"

    - name: Recreate replication pair for future use
      register: pair_result
      dellemc.powerflex.replication_pair:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        pairs:
          - source_volume_name: "testvol"
            target_volume_name: "testvol_target"
            copy_type: "OnlineCopy"
            name: "test_pair"
        rcg_name: "{{ rcg_name }}"
        remote_peer:
          hostname: "{{ remote_hostname }}"
          username: "{{ remote_username }}"
          password: "{{ remote_password }}"
          validate_certs: "{{ validate_certs }}"
