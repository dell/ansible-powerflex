---
- name: Device Operations
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Oslo1
    hostname: 'x.x.x.x'
    username: 'admin'
    password: 'Password'
    validate_certs: false
    # Oslo1 device IDs and SDS info
    device_id_1: "f3fa4b2000000000"
    device_id_2: "f3fa4b2200000001"
    sds_name_1: "trinity-sds1"
    sds_id_1: "a0d9a54500000002"
    storage_pool_name: "trinity-SP1"
    protection_domain_name: "trinity-PD"

  tasks:
    - name: Get device details using (current_pathname, sds_name)
      dellemc.powerflex.device:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        current_pathname: "/dev/sdc"
        sds_name: "{{ sds_name_1 }}"
        state: "present"

    - name: Get device details using (current_pathname, sds_id)
      dellemc.powerflex.device:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        current_pathname: "/dev/sdc"
        sds_id: "{{ sds_id_1 }}"
        state: "present"

    - name: Add a device
      dellemc.powerflex.device:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        current_pathname: "/dev/sde"
        sds_name: "{{ sds_name_1 }}"
        media_type: "HDD"
        device_name: "test_device"
        storage_pool_name: "{{ storage_pool_name }}"
        protection_domain_name: "{{ protection_domain_name }}"
        external_acceleration_type: "ReadAndWrite"
        state: "present"

    - name: Remove a device using device_name and sds_name
      dellemc.powerflex.device:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        device_name: "test_device"
        sds_name: "{{ sds_name_1 }}"
        state: "absent"
