---
- name: Device Group operations on PowerFlex Gen2
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    hostname: "x.x.x.x"
    username: "admin"
    password: "Password"
    validate_certs: false
    gateway_port: 443
    # Use existing device group from env.yml
    device_group_name: "{{ device_group_name }}"
    device_group_id: "{{ device_group_id }}"
    protection_domain_name: "{{ protection_domain_name }}"
    dg_new_name: "ansible_example_dg_rn"
  module_defaults:
    dellemc.powerflex.device_group:
      hostname: "{{ hostname }}"
      username: "{{ username }}"
      password: "{{ password }}"
      validate_certs: "{{ validate_certs }}"
      port: "{{ gateway_port }}"
  tasks:
    - name: Get device group details by name
      dellemc.powerflex.device_group:
        device_group_name: "{{ device_group_name }}"
        state: "present"

    - name: Get device group details by ID
      dellemc.powerflex.device_group:
        device_group_id: "{{ device_group_id }}"
        state: "present"

    - name: Get device group details scoped by protection domain
      dellemc.powerflex.device_group:
        device_group_name: "{{ device_group_name }}"
        protection_domain_name: "{{ protection_domain_name }}"
        state: "present"

    - name: Rename device group
      dellemc.powerflex.device_group:
        device_group_name: "{{ device_group_name }}"
        new_device_group_name: "{{ dg_new_name }}"
        state: "present"

    - name: Update spare node count
      dellemc.powerflex.device_group:
        device_group_name: "{{ dg_new_name }}"
        spare_node_count: 1
        state: "present"
      failed_when: false  # May fail if array capacity is too small

    - name: Update spare device count
      dellemc.powerflex.device_group:
        device_group_name: "{{ dg_new_name }}"
        spare_device_count: 1
        state: "present"
      failed_when: false  # May fail if array capacity is too small

    - name: Rename and update spare counts together
      dellemc.powerflex.device_group:
        device_group_id: "{{ device_group_id }}"
        new_device_group_name: "{{ device_group_name }}"
        spare_node_count: 0
        spare_device_count: 0
        state: "present"

    - name: Query usable capacity for a device group
      dellemc.powerflex.device_group:
        device_group_name: "{{ device_group_name }}"
        query_usable_capacity: true
        state: "present"
