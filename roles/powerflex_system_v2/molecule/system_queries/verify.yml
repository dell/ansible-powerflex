- name: Verify - powerflex_system_v2
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Verify system info was queried
      ansible.builtin.assert:
        that:
          - powerflex_system_v2_info_result is defined
          - powerflex_system_v2_array is defined
          - powerflex_system_v2_array.id is defined

    - name: Verify health report was generated
      ansible.builtin.assert:
        that:
          - powerflex_system_v2_health_report is defined
          - powerflex_system_v2_health_report.system_id is defined

    - name: Verify MDM validation ran
      ansible.builtin.assert:
        that:
          - powerflex_system_v2_mdm_valid is defined
