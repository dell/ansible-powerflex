# Volume lifecycle management tasks (AC2)

- name: Create volume
  dellemc.powerflex.volume_v2:
    hostname: "{{ powerflex_gateway_hostname }}"
    username: "{{ powerflex_gateway_username }}"
    password: "{{ powerflex_gateway_password }}"
    validate_certs: "{{ powerflex_gateway_validate_certs }}"
    port: "{{ powerflex_gateway_port }}"
    vol_name: "{{ powerflex_volume_name }}"
    size: "{{ powerflex_volume_size_gb }}"
    cap_unit: "GB"
    storage_pool_name: "{{ powerflex_volume_storage_pool_name }}"
    protection_domain_name: "{{ powerflex_volume_protection_domain_name }}"
    state: present
  register: powerflex_provisioning_v2_volume_create_result
  when: powerflex_volume_name | default('', true) | length > 0

- name: Modify volume (resize)
  dellemc.powerflex.volume_v2:
    hostname: "{{ powerflex_gateway_hostname }}"
    username: "{{ powerflex_gateway_username }}"
    password: "{{ powerflex_gateway_password }}"
    validate_certs: "{{ powerflex_gateway_validate_certs }}"
    port: "{{ powerflex_gateway_port }}"
    vol_id: "{{ powerflex_provisioning_v2_volume_create_result.volume_details.id | default('') }}"
    size: "{{ powerflex_volume_size_gb }}"
    cap_unit: "GB"
    state: present
  when:
    - powerflex_provisioning_v2_volume_create_result.changed | default(false)
    - (powerflex_volume_size_gb | default(0) | int) > 0

- name: Rename volume
  dellemc.powerflex.volume_v2:
    hostname: "{{ powerflex_gateway_hostname }}"
    username: "{{ powerflex_gateway_username }}"
    password: "{{ powerflex_gateway_password }}"
    validate_certs: "{{ powerflex_gateway_validate_certs }}"
    port: "{{ powerflex_gateway_port }}"
    vol_id: "{{ powerflex_provisioning_v2_volume_create_result.volume_details.id | default('') }}"
    vol_new_name: "{{ powerflex_volume_name }}_renamed"
    state: present
  when:
    - powerflex_provisioning_v2_volume_create_result.changed | default(false)
    - powerflex_volume_rename | default(false)

- name: Map volume to SDC
  dellemc.powerflex.volume_v2:
    hostname: "{{ powerflex_gateway_hostname }}"
    username: "{{ powerflex_gateway_username }}"
    password: "{{ powerflex_gateway_password }}"
    validate_certs: "{{ powerflex_gateway_validate_certs }}"
    port: "{{ powerflex_gateway_port }}"
    vol_id: "{{ powerflex_provisioning_v2_volume_create_result.volume_details.id | default('') }}"
    sdc:
      - sdc_id: "{{ powerflex_volume_sdc_id | default('') }}"
    sdc_state: "mapped"
    state: present
  when:
    - powerflex_provisioning_v2_volume_create_result.changed | default(false)
    - powerflex_volume_sdc_id | default('', true) | length > 0

- name: Unmap volume from SDC
  dellemc.powerflex.volume_v2:
    hostname: "{{ powerflex_gateway_hostname }}"
    username: "{{ powerflex_gateway_username }}"
    password: "{{ powerflex_gateway_password }}"
    validate_certs: "{{ powerflex_gateway_validate_certs }}"
    port: "{{ powerflex_gateway_port }}"
    vol_id: "{{ powerflex_provisioning_v2_volume_create_result.volume_details.id | default('') }}"
    sdc:
      - sdc_id: "{{ powerflex_volume_sdc_id | default('') }}"
    sdc_state: "unmapped"
    state: present
  when:
    - powerflex_provisioning_v2_volume_create_result.changed | default(false)
    - powerflex_volume_unmap | default(false)

- name: Delete volume
  dellemc.powerflex.volume_v2:
    hostname: "{{ powerflex_gateway_hostname }}"
    username: "{{ powerflex_gateway_username }}"
    password: "{{ powerflex_gateway_password }}"
    validate_certs: "{{ powerflex_gateway_validate_certs }}"
    port: "{{ powerflex_gateway_port }}"
    vol_id: "{{ powerflex_provisioning_v2_volume_create_result.volume_details.id | default('') }}"
    state: absent
  when:
    - powerflex_provisioning_v2_volume_create_result.changed | default(false)
    - powerflex_volume_delete | default(false)
